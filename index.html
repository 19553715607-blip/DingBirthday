        /* ============================================================
         * 「丁睿」星尘文字：离屏画布采样文字像素 → 3D 粒子汇聚成形
         * ==========================================================*/

        // 采样文字像素，生成星尘粒子（从散乱状态汇聚成名字）
        function createNameDust() {
            const cv = document.createElement('canvas');
            const ctx = cv.getContext('2d');
            ctx.font = '400 230px "Noto Sans SC","Microsoft YaHei","PingFang SC",sans-serif';
            const nameW = ctx.measureText(BIRTHDAY.name).width;
            ctx.font = '400 62px Orbitron, sans-serif';
            const subW = 62 * 8.2; // HAPPY BIRTHDAY 近似宽度
            const W = Math.ceil(Math.max(nameW, subW)) + 80;
            const H = 400;
            cv.width = W; cv.height = H;

            ctx.fillStyle = '#fff';
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.font = '400 230px "Noto Sans SC","Microsoft YaHei","PingFang SC",sans-serif';
            ctx.fillText(BIRTHDAY.name, W / 2, H * 0.38);
            ctx.font = '400 58px Orbitron, sans-serif';
            ctx.fillText('HAPPY BIRTHDAY', W / 2, H * 0.74);
            ctx.font = '400 30px Orbitron, sans-serif';
            ctx.fillText('★  10 · 25  ★', W / 2, H * 0.9);

            const data = ctx.getImageData(0, 0, W, H).data;
            const targets = [], starts = [], colors = [], haloColors = [];
            const SCALE = 118;
            // 名字专属配色：暖金 → 珍珠白 → 紫罗兰，与蓝色星野形成对比
            const cTop = new THREE.Color(0xffd37f);
            const cMid = new THREE.Color(0xfff6e8);
            const cBot = new THREE.Color(0xc9a7ff);
            const cHalo = new THREE.Color(0xffc47a);

            // 采样步长 2px：细密星尘 + 锐利光点，保证笔画边缘清晰
            for (let y = 0; y < H; y += 2) {
                for (let x = 0; x < W; x += 2) {
                    if (data[(y * W + x) * 4 + 3] > 128) {
                        const tx = (x - W / 2) / SCALE;
                        const ty = -(y - H / 2) / SCALE + 0.2;
                        const tz = (Math.random() - 0.5) * 0.08;
                        targets.push(tx, ty, tz);
                        // 起点：从名字附近的星辰汇聚而成（近距离散乱分布）
                        const theta = Math.random() * Math.PI * 2, phi = Math.acos(Math.random() * 2 - 1);
                        const rr = 3 + Math.random() * 4;
                        starts.push(
                            tx + rr * Math.sin(phi) * Math.cos(theta),
                            ty + rr * Math.sin(phi) * Math.sin(theta) * 0.6,
                            tz + rr * Math.cos(phi) * 0.3 - 2
                        );
                        // 颜色按纵向渐变：科技银 + 宇宙蓝，亮度上浮让名字更耀眼
                        const mix = y / H;
                        const c = mix < .5
                            ? cTop.clone().lerp(cMid, mix * 2)
                            : cMid.clone().lerp(cBot, (mix - .5) * 2);
                        const jitter = 0.9 + Math.random() * 0.15;
                        colors.push(c.r * jitter, c.g * jitter, c.b * jitter);
                        // 光晕层：统一青蓝色柔光
                        const hk = 0.55 + Math.random() * 0.3;
                        haloColors.push(cHalo.r * hk, cHalo.g * hk, cHalo.b * hk);
                    }
                }
            }

            // 主层与光晕层共享同一份位置属性，一次更新两层同步
            const posAttr = new THREE.BufferAttribute(new Float32Array(starts), 3);
            const geo = new THREE.BufferGeometry();
            geo.setAttribute('position', posAttr);
            geo.setAttribute('color', new THREE.BufferAttribute(new Float32Array(colors), 3));
            const mat = new THREE.PointsMaterial({
                size: .042, map: pointTex, vertexColors: true, transparent: true, opacity: 0,
                blending: THREE.AdditiveBlending, depthWrite: false
            });
            const points = new THREE.Points(geo, mat);
            fxGroup.add(points);

            // 小尺寸极低透明度的微光层：仅添星尘气息，不干扰笔画清晰度
            const haloGeo = new THREE.BufferGeometry();
            haloGeo.setAttribute('position', posAttr);
            haloGeo.setAttribute('color', new THREE.BufferAttribute(new Float32Array(haloColors), 3));
            const haloMat = new THREE.PointsMaterial({
                size: .1, map: glowTex, vertexColors: true, transparent: true, opacity: 0,
                blending: THREE.AdditiveBlending, depthWrite: false
            });
            const halo = new THREE.Points(haloGeo, haloMat);
            fxGroup.add(halo);

            // 名字背后的淡紫背光，进一步强化可读性
            const backMat = new THREE.SpriteMaterial({
                map: glowTex, color: 0x8a5fd8, transparent: true, opacity: 0,
                blending: THREE.AdditiveBlending, depthWrite: false
            });
            const backlight = new THREE.Sprite(backMat);
            backlight.scale.setScalar(9.5);
            backlight.position.z = -0.6;
            fxGroup.add(backlight);

            nameDust = {
                points, halo, backlight, posAttr,
                starts: new Float32Array(starts),
                targets: new Float32Array(targets),
                progress: 0, done: false,
                delay: 1.0   // 进入界面后约 1 秒自动开始汇聚
            };
        }

        // 每帧推进名字星尘的汇聚动画（延迟 1s 后由附近星辰汇聚成形）
        function updateNameDust(dt) {
            if (!nameDust || nameDust.done) return;
            // 延迟期：等待 1 秒后开始汇聚
            if (nameDust.delay > 0) {
                nameDust.delay -= dt;
                return;
            }
            nameDust.progress = Math.min(1, nameDust.progress + dt / 2.0);
            const p = nameDust.progress;
            const ease = 1 - Math.pow(1 - p, 3); // easeOutCubic
            const arr = nameDust.posAttr.array;
            for (let i = 0; i < arr.length; i++) {
                arr[i] = nameDust.starts[i] + (nameDust.targets[i] - nameDust.starts[i]) * ease;
            }
            nameDust.posAttr.needsUpdate = true; // 主层与光晕层共享属性，一次更新
            nameDust.points.material.opacity = Math.min(0.92, p * 1.2);
            nameDust.halo.material.opacity = Math.min(0.05, p * 0.08);
            nameDust.backlight.material.opacity = Math.min(0.04, p * 0.06);
            if (p >= 1) { nameDust.done = true; nameAssembled = true; }
        }

        /* ============================================================
         * 丁睿专属星座：天蝎座 Scorpius（真实星点连线，点击后逐段点亮）
         * ==========================================================*/

        // 生成天蝎座全息文字标签（♏ 符号 + 名称），点亮后渐显
        function makeScorpiusLabel() {
            const c = document.createElement('canvas'); c.width = 480; c.height = 120;
            const ctx = c.getContext('2d');
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.shadowColor = 'rgba(111,227,255,.9)'; ctx.shadowBlur = 18;
            ctx.fillStyle = '#aef0ff';
            ctx.font = '64px "Noto Sans SC","Segoe UI Symbol",sans-serif';
            ctx.fillText('♏', 60, 62);
            ctx.font = '400 34px Orbitron, sans-serif';
            ctx.fillText('SCORPIUS', 270, 48);
            ctx.font = '400 24px "Noto Sans SC",sans-serif';
            ctx.fillStyle = 'rgba(180,225,255,.85)';
            ctx.shadowBlur = 10;
            ctx.fillText('天 蝎 座', 270, 86);
            const tex = new THREE.CanvasTexture(c);
            const sp = new THREE.Sprite(new THREE.SpriteMaterial({
                map: tex, transparent: true, opacity: 0,
                blending: THREE.AdditiveBlending, depthWrite: false
            }));
            sp.scale.set(4.5, 1.12, 1);
            sp.position.set(5.5, 5.5, -1.1);
            return sp;
        }

        // 天蝎座原始星点坐标 → 缩放铺满全屏后的目标坐标
        function scorpiusTargets() {
            // 原始坐标中心约 (-0.085, 3.595)，缩放 2.5 倍并居中到原点
            const SX = 2.5, XC = -0.085, SY = 2.5, YC = 3.595, Z = -1.1;
            const raw = [
                [-1.86, 5.36], [-2.37, 5.50], [-2.60, 5.05], [-2.66, 4.49],
                [-1.62, 4.57], [-1.21, 4.45], [-0.91, 4.16], [-0.08, 3.18],
                [-0.11, 2.59], [-0.02, 1.89], [0.82, 1.76], [2.00, 1.79],
                [2.49, 2.25], [2.25, 2.43], [1.83, 2.73], [1.69, 2.70]
            ];
            return raw.map(s => [(s[0] - XC) * SX, (s[1] - YC) * SY, Z]);
        }

        // 创建天蝎座（暗星从屏幕外汇聚 → 连线逐段点亮）
        function createConstellation() {
            const Z = -1.1;
            const BLUE = [0.45, 0.78, 1.0];
            const BRIGHT = [0.72, 0.9, 1.0];
            const ANTARES = [1.0, 0.62, 0.32];
            // [尺寸, 颜色]，顺序对应 scorpiusTargets 的 16 颗星
            const STAR_META = [
                [0.80, BLUE], [1.05, BRIGHT], [1.10, BRIGHT], [0.85, BLUE],
                [0.95, BLUE], [1.55, ANTARES], [0.80, BLUE], [1.00, BRIGHT],
                [0.85, BLUE], [0.90, BLUE], [0.85, BLUE], [1.05, BRIGHT],
                [0.95, BLUE], [0.85, BLUE], [1.30, BRIGHT], [0.85, BLUE]
            ];
            const EDGES = [
                [0, 1], [1, 2], [2, 3], [3, 4], [4, 1],
                [4, 5], [5, 6], [6, 7], [7, 8], [8, 9], [9, 10],
                [10, 11], [11, 12], [12, 13], [13, 14], [14, 15]
            ];

            const targets = scorpiusTargets();
            const n = targets.length;
            // 汇聚起点：每颗星从屏幕外汇入目标位置
            const starStarts = new Float32Array(n * 3);
            const starCol = new Float32Array(n * 3);
            const starSize = new Float32Array(n);
            const starPhase = new Float32Array(n);
            for (let i = 0; i < n; i++) {
                const ang = Math.random() * Math.PI * 2;
                const dist = 8 + Math.random() * 6;
                starStarts[i * 3] = targets[i][0] + Math.cos(ang) * dist;
                starStarts[i * 3 + 1] = targets[i][1] + Math.sin(ang) * dist * 0.7;
                starStarts[i * 3 + 2] = Z + (Math.random() - 0.5) * 3;
                starCol[i * 3] = STAR_META[i][1][0];
                starCol[i * 3 + 1] = STAR_META[i][1][1];
                starCol[i * 3 + 2] = STAR_META[i][1][2];
                starSize[i] = STAR_META[i][0];
                starPhase[i] = Math.random() * Math.PI * 2;
            }
            // 初始 position = 汇聚起点（从远处飞入）
            const posAttr = new THREE.BufferAttribute(new Float32Array(starStarts), 3);
            const sGeo = new THREE.BufferGeometry();
            sGeo.setAttribute('position', posAttr);
            sGeo.setAttribute('color', new THREE.BufferAttribute(starCol, 3));
            sGeo.setAttribute('aSize', new THREE.BufferAttribute(starSize, 1));
            sGeo.setAttribute('aPhase', new THREE.BufferAttribute(starPhase, 1));
            const uni = {
                uTime: { value: 0 },
                uMap: { value: glowTex },
                uOpacity: { value: 0 },
                uBoost: { value: 0 },
                uHeightScale: { value: 100 }
            };
            const sMat = new THREE.ShaderMaterial({
                uniforms: uni,
                transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
                vertexShader: `
                    uniform float uTime, uOpacity, uBoost, uHeightScale;
                    attribute float aSize, aPhase;
                    attribute vec3 color;
                    varying float vTw;
                    varying vec3 vColor;
                    void main(){
                        vColor = color;
                        float tw = 0.78 + 0.22 * sin(uTime * 2.1 + aPhase);
                        vTw = tw;
                        vec4 mv = modelViewMatrix * vec4(position, 1.0);
                        gl_PointSize = aSize * uHeightScale / max(-mv.z, 0.1)
                                     * (0.9 + 0.25 * tw) * (1.0 + uBoost * 0.45);
                        gl_Position = projectionMatrix * mv;
                    }
                `,
                fragmentShader: `
                    uniform sampler2D uMap;
                    uniform float uOpacity, uBoost;
                    varying float vTw;
                    varying vec3 vColor;
                    void main(){
                        vec4 tex = texture2D(uMap, gl_PointCoord);
                        if (tex.a < 0.02) discard;
                        float gain = (0.55 + 0.45 * vTw) * (0.55 + uBoost * 0.7);
                        gl_FragColor = vec4(vColor * gain, tex.a * uOpacity);
                    }
                `
            });
            const stars = new THREE.Points(sGeo, sMat);
            fxGroup.add(stars);

            // 连线位置 = 目标位置，用 drawRange 控制逐段显现
            const linePos = [];
            EDGES.forEach(([a, b]) => {
                linePos.push(targets[a][0], targets[a][1], Z, targets[b][0], targets[b][1], Z);
            });
            const lGeo = new THREE.BufferGeometry();
            lGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(linePos), 3));
            const lMat = new THREE.LineBasicMaterial({
                color: 0x8fe8ff, transparent: true, opacity: 0,
                blending: THREE.AdditiveBlending, depthWrite: false
            });
            const lines = new THREE.LineSegments(lGeo, lMat);
            fxGroup.add(lines);

            /* ===== 蝎子形状轮廓（仅在星座点亮后渐显） ===== */
            // 精细结构：双钳（含可动指/不动指）、头胸部、分节腹部、4 对步足、弯曲分节尾 + 毒刺
            // 金色琥珀线，叠在星座连线之上（Z 略靠前），半透明保证连线仍清晰
            const SOZ = -1.15;
            const sSegs = [];   // 每段为 [x1,y1,z1, x2,y2,z2]
            // 辅助：把一串点连成折线（每个顶点带 Z=SOZ）
            function poly(pts) {
                for (let i = 0; i < pts.length - 1; i++) {
                    sSegs.push(pts[i][0], pts[i][1], SOZ, pts[i + 1][0], pts[i + 1][1], SOZ);
                }
            }

            /* —— 左钳：由基节→外弧（不动指）→ 指尖回弯 → 可动指 构成 —— */
            poly([
                [-2.2, 4.0], [-3.0, 4.8], [-4.0, 5.3], [-5.0, 5.9], [-5.7, 6.7],
                [-5.4, 7.4], [-4.7, 7.5], [-4.3, 7.1],   // 不动指指尖回弯
                [-4.1, 6.5], [-3.7, 5.8], [-3.2, 5.0], [-2.3, 4.1]
            ]);
            poly([[-3.2, 5.0], [-3.8, 5.9], [-4.2, 6.5], [-4.6, 7.0]]);  // 可动指

            /* —— 右钳（镜像） —— */
            poly([
                [2.2, 4.0], [3.0, 4.8], [4.0, 5.3], [5.0, 5.9], [5.7, 6.7],
                [5.4, 7.4], [4.7, 7.5], [4.3, 7.1],
                [4.1, 6.5], [3.7, 5.8], [3.2, 5.0], [2.3, 4.1]
            ]);
            poly([[3.2, 5.0], [3.8, 5.9], [4.2, 6.5], [4.6, 7.0]]);

            /* —— 头胸部 + 腹部 整体外轮廓（连续闭合折线） —— */
            poly([
                [-2.2, 4.0], [-1.5, 4.25], [0, 4.3], [1.5, 4.25], [2.2, 4.0],   // 头胸背板上缘
                [2.6, 3.5], [2.5, 2.6], [2.3, 1.6], [2.0, 0.6],                // 头胸右侧
                [2.5, 0.0], [2.85, -1.0], [2.75, -2.1], [2.2, -3.0],           // 腹右侧（中段膨出）
                [1.4, -3.5], [0.5, -3.75], [-0.5, -3.75], [-1.4, -3.5],       // 腹末（尾节连接）
                [-2.2, -3.0], [-2.75, -2.1], [-2.85, -1.0], [-2.5, 0.0],      // 腹左侧
                [-2.0, 0.6], [-2.3, 1.6], [-2.5, 2.6], [-2.6, 3.5], [-2.2, 4.0] // 头胸左侧回到起点
            ]);

            /* —— 腹部分节线（体节之间的横隔） —— */
            poly([[-2.55, 2.55], [2.55, 2.55]]);
            poly([[-2.75, 1.4], [2.75, 1.4]]);
            poly([[-2.85, 0.2], [2.85, 0.2]]);
            poly([[-2.8, -1.0], [2.8, -1.0]]);
            poly([[-2.55, -2.1], [2.55, -2.1]]);

            /* —— 4 对步足（每足 3 节，向外下方展开） —— */
            // 左侧
            poly([[-2.45, 3.1], [-3.9, 2.6], [-5.1, 3.3], [-5.7, 4.2]]);
            poly([[-2.6, 2.0], [-4.3, 1.3], [-5.6, 1.6], [-6.4, 2.4]]);
            poly([[-2.7, 0.9], [-4.4, -0.1], [-6.0, -0.3], [-7.0, 0.7]]);
            poly([[-2.8, -0.1], [-4.5, -1.4], [-6.2, -2.0], [-7.4, -1.1]]);
            // 右侧（镜像）
            poly([[2.45, 3.1], [3.9, 2.6], [5.1, 3.3], [5.7, 4.2]]);
            poly([[2.6, 2.0], [4.3, 1.3], [5.6, 1.6], [6.4, 2.4]]);
            poly([[2.7, 0.9], [4.4, -0.1], [6.0, -0.3], [7.0, 0.7]]);
            poly([[2.8, -0.1], [4.5, -1.4], [6.2, -2.0], [7.4, -1.1]]);

            /* —— 尾：从腹末向左下方弯曲，分 6 节，末端毒刺上翘 —— */
            poly([
                [0, -3.75], [0.1, -4.6], [0.4, -5.5], [1.0, -6.3],
                [1.9, -6.9], [2.9, -7.25], [4.0, -7.15],
                [4.9, -6.75], [5.5, -6.0], [5.8, -5.1]
            ]);
            // 毒刺（由 telson 伸出的双尖）
            poly([[5.8, -5.1], [6.3, -4.3], [6.1, -3.6]]);
            poly([[5.8, -5.1], [5.6, -4.2], [5.9, -3.5]]);
            // 尾部分节标记（垂直于尾轴的短刻痕）
            poly([[0.35, -4.55], [-0.15, -4.7]]);
            poly([[0.75, -5.45], [0.2, -5.7]]);
            poly([[1.35, -6.2], [0.75, -6.5]]);
            poly([[2.25, -6.85], [1.65, -7.15]]);
            poly([[3.25, -7.2], [2.7, -7.35]]);
            poly([[4.25, -7.0], [3.8, -7.2]]);
            poly([[5.0, -6.5], [4.7, -6.8]]);

            // 构建 LineSegments 几何
            const scorpGeo = new THREE.BufferGeometry();
            scorpGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(sSegs), 3));
            const scorpMat = new THREE.LineBasicMaterial({
                color: 0xffb347, transparent: true, opacity: 0,
                blending: THREE.AdditiveBlending, depthWrite: false
            });
            const scorpionOutline = new THREE.LineSegments(scorpGeo, scorpMat);
            fxGroup.add(scorpionOutline);

            const label = makeScorpiusLabel();
            fxGroup.add(label);

            // 将目标坐标展平为 Float32Array 便于逐帧插值
            const targetFlat = new Float32Array(n * 3);
            for (let i = 0; i < n; i++) {
                targetFlat[i * 3] = targets[i][0];
                targetFlat[i * 3 + 1] = targets[i][1];
                targetFlat[i * 3 + 2] = targets[i][2];
            }
            constellation = {
                stars, lines, scorpionOutline, label, uni, posAttr,
                starts: starStarts, targets: targetFlat,
                conv: 0, convDone: false,
                lit: false, progress: 0,
                totalVerts: EDGES.length * 2,
                delay: 1.0   // 进入界面后约 1 秒自动开始汇聚
            };
            resizeUniList.push(uni);
        }

        // 触发星座汇聚 + 点亮（按钮可再次触发，重置整条动画）
        function lightConstellation() {
            if (!constellation) return;
            // 重置：星点回到屏幕外起点，重新汇聚 + 连线
            constellation.conv = 0;
            constellation.convDone = false;
            constellation.lit = false;
            constellation.progress = 0;
            constellation.delay = 0; // 按钮再触发：立即开始，不等待延迟
            constellation.uni.uOpacity.value = 0;
            constellation.uni.uBoost.value = 0;
            constellation.lines.material.opacity = 0;
            constellation.lines.geometry.setDrawRange(0, 0);
            constellation.scorpionOutline.material.opacity = 0;
            constellation.label.material.opacity = 0;
            // 把 position 重置为汇聚起点
            const arr = constellation.posAttr.array;
            for (let i = 0; i < arr.length; i++) arr[i] = constellation.starts[i];
            constellation.posAttr.needsUpdate = true;
            tone(880, .15, 'sine', .04);
            tone(1320, .25, 'sine', .035, .12);
            showToast('天蝎座 ♏ 星辰汇聚中');
        }

        // 每帧推进天蝎座：先汇聚（星点从屏幕外飞向目标），再连线逐段点亮
        function updateConstellation(dt, t) {
            if (!constellation) return;
            constellation.uni.uTime.value = t;

            // 阶段一：延迟等待
            if (constellation.delay > 0) {
                constellation.delay -= dt;
                return;
            }

            // 阶段二：星点从屏幕外汇聚到目标位置
            if (constellation.conv < 1) {
                constellation.conv = Math.min(1, constellation.conv + dt / 1.8);
                const ease = 1 - Math.pow(1 - constellation.conv, 3); // easeOutCubic
                const arr = constellation.posAttr.array;
                for (let i = 0; i < arr.length; i++) {
                    arr[i] = constellation.starts[i] + (constellation.targets[i] - constellation.starts[i]) * ease;
                }
                constellation.posAttr.needsUpdate = true;
                // 汇聚过程中星点渐显
                constellation.uni.uOpacity.value = 0.3 * constellation.conv;
                if (constellation.conv >= 1) {
                    constellation.convDone = true;
                    constellation.lit = true; // 汇聚完成后自动进入点亮阶段
                }
                return;
            }

            // 阶段三：连线逐段点亮 + 星点增辉 + 标签渐显
            if (!constellation.lit) return;
            constellation.progress = Math.min(1, constellation.progress + dt / 2.6);
            const p = constellation.progress;
            constellation.lines.material.opacity = 0.85 * p;
            constellation.lines.geometry.setDrawRange(0, Math.floor(p * constellation.totalVerts));
            constellation.uni.uOpacity.value = 0.3 + 0.3 * p;
            constellation.uni.uBoost.value = 0.5 * p;
            constellation.label.material.opacity = 0.9 * p;
            // 阶段四：连线接近完成时，金色蝎子轮廓渐显（在连线之后出现，不干扰连线辨识）
            // progress > 0.85 开始显现，1.0 时达到目标透明度 0.55
            const oStart = 0.85;
            const oP = Math.max(0, (p - oStart) / (1 - oStart));
            constellation.scorpionOutline.material.opacity = 0.55 * oP;
        }

        /* ============================================================
         * 点击恒星：粒子爆发 + 自动开启全息广播
         * ==========================================================*/

        // 创建可回收的粒子爆发池
        function createBurstSystem() {
            const N = 260;
            const pos = new Float32Array(N * 3);
            const vel = new Float32Array(N * 3);
            const geo = new THREE.BufferGeometry();
            geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
            const mat = new THREE.PointsMaterial({
                size: .16, map: glowTex, color: 0xbfe9ff, transparent: true, opacity: 0,
                blending: THREE.AdditiveBlending, depthWrite: false
            });
            const points = new THREE.Points(geo, mat);
            fxGroup.add(points);
            burstSys = { points, geo, vel, life: 0, N };
        }

        // 从指定位置发射一次粒子爆发
        function burstAt(origin) {
            const arr = burstSys.geo.attributes.position.array;
            for (let i = 0; i < burstSys.N; i++) {
                arr[i * 3] = origin.x; arr[i * 3 + 1] = origin.y; arr[i * 3 + 2] = origin.z;
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos(Math.random() * 2 - 1);
                const sp = 2.5 + Math.random() * 4.5;
                burstSys.vel[i * 3] = sp * Math.sin(phi) * Math.cos(theta);
                burstSys.vel[i * 3 + 1] = sp * Math.sin(phi) * Math.sin(theta);
                burstSys.vel[i * 3 + 2] = sp * Math.cos(phi) * 0.5;
            }
            burstSys.geo.attributes.position.needsUpdate = true;
            burstSys.life = 1;
        }

        // 每帧更新爆发粒子运动与衰减
        function updateBurst(dt) {
            if (burstSys.life <= 0) return;
            burstSys.life = Math.max(0, burstSys.life - dt / 1.4);
            const arr = burstSys.geo.attributes.position.array;
            for (let i = 0; i < burstSys.N; i++) {
                arr[i * 3] += burstSys.vel[i * 3] * dt;
                arr[i * 3 + 1] += burstSys.vel[i * 3 + 1] * dt;
                arr[i * 3 + 2] += burstSys.vel[i * 3 + 2] * dt;
                burstSys.vel[i * 3] *= .96; burstSys.vel[i * 3 + 1] *= .96; burstSys.vel[i * 3 + 2] *= .96;
            }
            burstSys.geo.attributes.position.needsUpdate = true;
            burstSys.points.material.opacity = burstSys.life;
        }

        /* ============================================================
         * 曲速探索：星野高速流动 + 星线拉伸 + FOV 冲击 + 闪光
         * ==========================================================*/

        // 启动曲速航行
        function startWarp() {
            if (warp.active) return;
            warp.active = true; warp.t = 0;
            warpSweep();
            showToast('曲速引擎启动 · 正在穿越星门');
        }

        // 每帧推进曲速包络（0→1→0 的正弦曲线）
        function updateWarp(dt) {
            const flash = document.getElementById('warpFlash');
            if (warp.active) {
                warp.t += dt;
                const p = warp.t / warp.dur;
                if (p >= 1) {
                    warp.active = false; warp.env = 0;
                    flash.style.opacity = 0;
                    camera.fov = 60; camera.updateProjectionMatrix();
                    showToast('已抵达 · 丁睿生日星系 · ' + BIRTHDAY.date);
                    tone(660, .3, 'sine', .04); tone(990, .4, 'sine', .035, .15);
                    return;
                }
                warp.env = Math.sin(p * Math.PI);
            } else {
                warp.env *= 0.92;
            }
            // FOV 冲击营造加速感
            camera.fov = 60 + warp.env * 26;
            camera.updateProjectionMatrix();
            flash.style.opacity = (warp.env * warp.env * 0.55).toFixed(3);
        }

        /* ============================================================
         * 全息投影：星际广播打字机
         * ==========================================================*/
        let broadcastToken = 0;

        // 打开全息面板并逐段播送祝福语
        async function startBroadcast() {
            ensureAudio();
            const holo = document.getElementById('holo');
            const body = document.getElementById('holoBody');
            const token = ++broadcastToken;
            holo.classList.add('show');
            body.innerHTML = '';
            tone(520, .18, 'sine', .04); tone(780, .25, 'sine', .035, .15);

            for (let mi = 0; mi < MESSAGES.length; mi++) {
                if (token !== broadcastToken) return;
                // 每段祝福独立的段落 + 打字光标
                const p = document.createElement('p');
                const target = document.createElement('span');
                const caret = document.createElement('span');
                caret.className = 'caret';
                p.appendChild(target);
                p.appendChild(caret);
                body.appendChild(p);
                p.classList.add('on'); // 立即可见，边打字边显示
                // 逐字输出（HTML 标签整体跳过，保证 <span> 样式生效）
                const html = MESSAGES[mi];
                let out = '';
                for (let i = 0; i < html.length; i++) {
                    if (token !== broadcastToken) return;
                    if (html[i] === '<') { const end = html.indexOf('>', i); out += html.slice(i, end + 1); i = end; }
                    else out += html[i];
                    target.innerHTML = out;
                    if (html[i] !== ' ' && i % 3 === 0) tone(1100 + Math.random() * 300, .03, 'square', .008);
                    await sleep(26 + Math.random() * 26);
                }
                caret.remove();
                await sleep(420);
            }
            if (token !== broadcastToken) return;
            const sig = document.createElement('p');
            sig.className = 'sig on';
            sig.textContent = SIGNATURE;
            body.appendChild(sig);
            tone(880, .4, 'sine', .035);
        }

        // 工具：延时 Promise
        function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

        /* ============================================================
         * Toast 提示
         * ==========================================================*/
        let toastTimer = null;

        // 显示一条顶部悬浮提示
        function showToast(text) {
            const el = document.getElementById('toast');
            el.textContent = text;
            el.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => el.classList.remove('show'), 2600);
        }

        /* ============================================================
         * 交互绑定：拖拽旋转 / 滚轮缩放 / 点击恒星 / 按钮
         * ==========================================================*/

        // 绑定全部鼠标与触摸交互
        function bindInteractions() {
            const canvas = renderer.domElement;

            // 按下：记录拖拽起点
            canvas.addEventListener('pointerdown', e => {
                ensureAudio();
                dragState.down = true; dragState.moved = 0;
                dragState.x = e.clientX; dragState.y = e.clientY;
            });

            // 移动：拖拽旋转 worldGroup，同时记录归一化指针用于视差
            window.addEventListener('pointermove', e => {
                pointer.x = (e.clientX / innerWidth) * 2 - 1;
                pointer.y = -(e.clientY / innerHeight) * 2 + 1;
                if (!dragState.down) return;
                const dx = e.clientX - dragState.x, dy = e.clientY - dragState.y;
                dragState.moved += Math.abs(dx) + Math.abs(dy);
                worldGroup.rotation.y += dx * 0.005;
                worldGroup.rotation.x += dy * 0.005;
                worldGroup.rotation.x = Math.max(-0.9, Math.min(0.9, worldGroup.rotation.x));
                dragState.x = e.clientX; dragState.y = e.clientY;
            });

            // 抬起：若几乎未移动则视为点击 → 射线检测中央恒星
            window.addEventListener('pointerup', e => {
                if (dragState.down && dragState.moved < 8) {
                    const ndc = new THREE.Vector2(
                        (e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1
                    );
                    raycaster.setFromCamera(ndc, camera);
                    const hit = raycaster.intersectObject(starSphere, false);
                    if (hit.length) {
                        // 恒星坐标转到 fxGroup 空间爆发
                        const local = fxGroup.worldToLocal(starSphere.getWorldPosition(new THREE.Vector3()));
                        burstAt(local);
                        tone(523, .12, 'sine', .04); tone(784, .2, 'sine', .04, .1);
                        if (!document.getElementById('holo').classList.contains('show')) {
                            setTimeout(startBroadcast, 350);
                        }
                    }
                }
                dragState.down = false;
            });

            // 滚轮缩放相机距离
            canvas.addEventListener('wheel', e => {
                e.preventDefault();
                camera.position.z = THREE.MathUtils.clamp(
                    camera.position.z + e.deltaY * 0.008, 6.5, 20
                );
            }, { passive: false });

            // 按钮：点亮星座
            document.getElementById('btnConstellation').addEventListener('click', () => {
                ensureAudio(); lightConstellation();
            });
            // 按钮：曲速探索
            document.getElementById('btnWarp').addEventListener('click', () => {
                ensureAudio(); startWarp();
            });
            // 按钮：星际广播
            document.getElementById('btnBroadcast').addEventListener('click', () => {
                startBroadcast();
            });
            // 关闭全息面板
            document.getElementById('holoClose').addEventListener('click', () => {
                broadcastToken++;
                document.getElementById('holo').classList.remove('show');
            });
            // 星盘转速滑块
            document.getElementById('speedRange').addEventListener('input', e => {
                autoSpeed = (e.target.value / 100) * 0.21;   // 0~0.21 rad/s
            });

            /* ---- 控制台音乐按钮：与右下角共享播放器双向同步 ---- */
            const btnMusic = document.getElementById('btnMusic');
            const mState = btnMusic.querySelector('.m-state');
            // 更新按钮显示状态
            function refreshMusicBtn(state) {
                btnMusic.classList.remove('playing', 'paused', 'error');
                if (state.hasError) {
                    btnMusic.classList.add('error');
                    mState.textContent = '未找到文件';
                    btnMusic.title = '请将《当你》音频放到 assets/music/dangni.mp3';
                } else if (state.playing) {
                    btnMusic.classList.add('playing');
                    mState.textContent = '播放中';
                    btnMusic.title = '背景音乐：林俊杰《当你》（点击暂停）';
                } else {
                    btnMusic.classList.add('paused');
                    mState.textContent = '已暂停';
                    btnMusic.title = '背景音乐：林俊杰《当你》（点击播放）';
                }
            }
            // 点击切换：派发事件给共享 music.js 处理
            btnMusic.addEventListener('click', () => {
                window.dispatchEvent(new CustomEvent('music-toggle'));
            });
            // 监听共享播放器的状态变化（含初始同步）
            window.addEventListener('music-state', e => refreshMusicBtn(e.detail));
            // music.js 可能在当前脚本之前已初始化并派发过事件，做一次兜底读取
            const audioEl = document.querySelector('audio');
            if (audioEl) refreshMusicBtn({ playing: !audioEl.paused, hasError: audioEl.error !== null });
        }

        /* ============================================================
         * 主循环
         * ==========================================================*/

        // 每帧更新所有动态元素并渲染
        function animate() {
            requestAnimationFrame(animate);
            const dt = Math.min(clock.getDelta(), 0.05);
            const t = clock.elapsedTime;

            // 星盘自动旋转（曲速时加速）
            const spinBoost = 1 + warp.env * 3.5;
            worldGroup.rotation.y += autoSpeed * dt * spinBoost;

            // 中央恒星系统：等离子表面时间推进 + 球体自转
            starSphere.material.uniforms.uTime.value = t;
            starSphere.rotation.y += dt * 0.15;
            wireShell.rotation.y -= dt * 0.22;
            wireShell.rotation.x += dt * 0.12;
            centralGroup.userData.shell2.rotation.y += dt * 0.3;
            centralGroup.userData.shell2.rotation.z -= dt * 0.18;
            particleRing.rotation.z += dt * 0.4;
            // 日珥 / 太阳风着色器时间
            coronaUniList.forEach(u => { u.uTime.value = t; });
            // 外层辉光呼吸 + 日冕弧环涨落
            const glow = centralGroup.userData.glow;
            glow.scale.setScalar(4.2 + Math.sin(t * 1.6) * 0.25);
            glow.material.opacity = 0.2 + Math.sin(t * 1.6) * 0.05;
            centralGroup.userData.coronaRings.forEach((ring, i) => {
                ring.material.opacity = 0.22 + 0.16 * (0.5 + 0.5 * Math.sin(t * 0.9 + i * 2.1));
                ring.rotation.z += dt * (i === 0 ? 0.25 : -0.18);
            });
            planets.forEach(p => {
                p.angle += p.speed * dt * 0.5;
                p.mesh.position.set(Math.cos(p.angle) * p.r, 0, Math.sin(p.angle) * p.r);
            });

            // 星云缓慢自转
            worldGroup.children.forEach(ch => {
                if (ch.isSprite && ch.material && ch.userData.rot) ch.material.rotation += ch.userData.rot * dt;
            });

            // 星野 / 曲速 / 星尘 / 星座 / 爆发
            starFieldUni.uTime.value = t;
            updateStarField(dt);
            updateWarp(dt);
            updateWarpStreaks(dt);
            updateNameDust(dt);
            updateConstellation(dt, t);
            updateBurst(dt);

            // 名字汇聚完成后的呼吸光效
            if (nameDust && nameDust.done) {
                nameDust.halo.material.opacity = 0.05 + Math.sin(t * 1.7) * 0.02;
                nameDust.backlight.material.opacity = 0.04 + Math.sin(t * 1.3) * 0.015;
            }

            // fxGroup 鼠标视差（名字与星座轻微跟随）+ 整体轻柔浮动
            fxGroup.rotation.y += (pointer.x * 0.12 - fxGroup.rotation.y) * 0.04;
            fxGroup.rotation.x += (-pointer.y * 0.1 - fxGroup.rotation.x) * 0.04;
            fxGroup.position.y = Math.sin(t * 0.7) * 0.12;

            composer.render();
        }

        /* ============================================================
         * 启动
         * ==========================================================*/

        // 构建整个宇宙场景并开始渲染
        function init() {
            glowTex = makeGlowTexture();
            pointTex = makePointTexture();
            initRenderer();

            worldGroup = new THREE.Group();
            fxGroup = new THREE.Group();
            scene.add(worldGroup);
            scene.add(fxGroup);

            createNebulas();
            createStarField();
            createWarpStreaks();
            createCentralStar();
            createNameDust();
            createConstellation();
            createBurstSystem();

            bindInteractions();
            onResize(); // 初始化时应用一次响应式缩放
            animate();

            // 加载层淡出
            setTimeout(() => document.getElementById('loading').classList.add('hide'), 700);
        }

        init();
    </script>
